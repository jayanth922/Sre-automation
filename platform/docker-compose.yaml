# =============================================================================
# SaaS Platform Stack — API, Dashboard, AI Agent, and infrastructure services
#
# All Dockerfiles for this stack live in platform/.
# All AI reasoning (LLM, LangGraph, OODA loop) happens here.
# Tool calls are dispatched directly to the edge MCP stack on host ports.
#
# Usage:  cd platform && docker compose up -d --build
# =============================================================================

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: sre-redis
    hostname: redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      sre-network:
        aliases:
          - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: sre-postgres
    hostname: postgres
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      sre-network:
        aliases:
          - postgres
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sre_user} -d ${POSTGRES_DB:-sre_platform}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sre-qdrant
    hostname: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      sre-network:
        aliases:
          - qdrant
    restart: unless-stopped

  # ollama:                        # Commented out — using Groq instead
  #   image: ollama/ollama:latest
  #   container_name: sre-ollama
  #   hostname: ollama
  #   ports:
  #     - "11435:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     sre-network:
  #       aliases:
  #         - ollama
  #   restart: unless-stopped

  # ============================================
  # Langfuse (self-hosted LLM/tool tracing — wired by default, see
  # sre_agent/tracing.py). Reuses the platform's postgres (own logical
  # database) and redis (own DB index); clickhouse + minio are new,
  # Langfuse-only backing services.
  # ============================================

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: sre-clickhouse
    hostname: clickhouse
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      sre-network:
        aliases:
          - clickhouse
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sre-minio
    hostname: minio
    command: server /data --console-address ":9091"
    environment:
      - MINIO_ROOT_USER=${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      - MINIO_ROOT_PASSWORD=${LANGFUSE_MINIO_ROOT_PASSWORD:-langfuse-minio}
    volumes:
      - minio_data:/data
    networks:
      sre-network:
        aliases:
          - minio
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the `langfuse` logical database on the shared postgres
  # server (idempotent — a pre-existing database is not an error) so Langfuse
  # gets its own schema without a second Postgres container.
  langfuse-db-init:
    image: postgres:15-alpine
    container_name: sre-langfuse-db-init
    env_file:
      - ../.env
    entrypoint: [ "sh", "-c" ]
    command:
      - >
        PGPASSWORD=$$POSTGRES_PASSWORD psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB
        -tc "SELECT 1 FROM pg_database WHERE datname = 'langfuse'" |
        grep -q 1 ||
        PGPASSWORD=$$POSTGRES_PASSWORD createdb -h postgres -U $$POSTGRES_USER langfuse
    networks:
      sre-network:
        aliases:
          - langfuse-db-init
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: sre-langfuse-worker
    hostname: langfuse-worker
    env_file:
      - ../.env
    environment:
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - REDIS_CONNECTION_STRING=redis://redis:6379/2
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_ROOT_PASSWORD:-langfuse-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
    networks:
      sre-network:
        aliases:
          - langfuse-worker
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: sre-langfuse-web
    hostname: langfuse-web
    env_file:
      - ../.env
    environment:
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}
      - REDIS_CONNECTION_STRING=redis://redis:6379/2
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_ROOT_PASSWORD:-langfuse-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - NEXTAUTH_URL=http://localhost:3030
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET_KEY}
      # Headless bootstrap: mints the org/project/API-keypair below on first
      # boot so LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY (fed to sre-agent-api)
      # work with zero manual UI setup.
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-sentinel}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-Sentinel}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-sentinel-agent}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-Sentinel Agent}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@sentinel.local}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-Sentinel Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - "3030:3000"
    networks:
      sre-network:
        aliases:
          - langfuse-web
    depends_on:
      langfuse-worker:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # SRE Agent API (Control Plane + AI Brain)
  # ============================================

  sre-agent-api:
    platform: linux/amd64
    build:
      context: ../
      dockerfile: platform/Dockerfile
      args:
        SENTINEL_CODE_SHA: ${SENTINEL_CODE_SHA:-unknown}
    container_name: sre-agent-api
    hostname: sre-agent-api
    command: >
      sh -c "uv run python -m sre_agent.provider_config && uv run alembic upgrade head && exec uv run uvicorn sre_agent.agent_runtime:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      # Topological fixed values that shouldn't be overridden via user .env
      - AGENT_MODE=api
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Self-hosted Langfuse (wired by default, see sre_agent/tracing.py) — the
      # public/secret pair matches langfuse-web's LANGFUSE_INIT_PROJECT_* below,
      # so tracing works immediately after a fresh boot with zero manual setup.
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY}

    networks:
      sre-network:
        aliases:
          - sre-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      langfuse-web:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # Dashboard (Next.js UI)
  # ============================================

  dashboard:
    platform: linux/amd64
    build:
      context: ../dashboard
      dockerfile: ../platform/Dockerfile.dashboard
    container_name: sre-dashboard
    ports:
      - "3002:3000"
    environment:
      - API_URL=http://sre-agent-api:8080
    depends_on:
      - sre-agent-api
    networks:
      sre-network:
        aliases:
          - dashboard

networks:
  sre-network:
    driver: bridge
    name: sre-platform-network

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  # ollama_data:                   # Commented out — using Groq instead
  #   driver: local
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  minio_data:
    driver: local
