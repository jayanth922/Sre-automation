# Example Secret for use with the Terraform Helm-release module.
# Apply BEFORE terraform apply. Never put these values into Terraform variables.
#
#   kubectl -n sentinel apply -f secret.example.yaml
#
# Generate values:
#   openssl rand -hex 32
#   python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())'
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
type: Opaque
stringData:
  SECRET_KEY: "replace-with-openssl-rand-hex-32"
  POSTGRES_PASSWORD: "replace-with-strong-password"
  CREDENTIAL_ENCRYPTION_KEY: "replace-with-urlsafe-base64-32-bytes"
  MCP_SERVICE_TOKEN: "replace-with-high-entropy-token"
  GROQ_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  LLM_API_KEY: ""
