# =============================================================================
# Secret template. Copy to secret.yaml and fill in real values:
#     cp secret.example.yaml secret.yaml   (secret.yaml is git-ignored)
# The install script does this for you if secret.yaml is missing.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
type: Opaque
stringData:
  # App
  SECRET_KEY: "change-me-to-a-long-random-string"
  # Postgres (must be consistent; the API builds DATABASE_URL from it)
  POSTGRES_PASSWORD: "change-me-postgres-password"
  # First admin login
  SEED_ADMIN_PASSWORD: "change-me-admin-password"
  # Model providers (fill the one you use; groq has a free tier)
  ANTHROPIC_API_KEY: ""
  GROQ_API_KEY: ""
  GOOGLE_API_KEY: ""
  NVIDIA_API_KEY: ""
  # Key for an on-site OpenAI-compatible LLM (leave blank if keyless)
  LLM_API_KEY: ""
  # Optional: GitHub token for the code-context / revert tools
  GITHUB_TOKEN: ""
  # Optional: Slack war-room (bot token enables incident mirroring; app token for replies)
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  # Optional: Langfuse agent tracing (both keys enable full LLM/tool span export)
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
