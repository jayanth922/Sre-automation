# =============================================================================
# Sentinel API — control plane + agent runtime. Runs DB migrations on start,
# then serves FastAPI/uvicorn. Talks to everything over in-cluster DNS.
# No seeding: the first person to register creates the org and becomes its admin.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: sentinel-api }
  template:
    metadata:
      labels: { app: sentinel-api }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: sentinel-api }
      containers:
        - name: api
          image: sentinel/api:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >
              uv run python -m sre_agent.provider_config &&
              uv run alembic upgrade head &&
              exec uv run uvicorn sre_agent.agent_runtime:app --host 0.0.0.0 --port 8080
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: sentinel-config }
            - secretRef: { name: sentinel-secrets }
          env:
            # Explicit vars so DATABASE_URL can be composed via $(VAR) substitution.
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: sentinel-config, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: sentinel-config, key: POSTGRES_DB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: PYTHONPATH
              value: /app
            - name: PYTHONUNBUFFERED
              value: "1"
          startupProbe:
            httpGet: { path: /ping, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1536Mi" }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: sentinel-api }
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  selector: { app: sentinel-api }
  ports:
    - port: 8080
      targetPort: 8080
