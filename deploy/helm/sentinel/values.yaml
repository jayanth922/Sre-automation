# =============================================================================
# Sentinel — Helm values. Everything the platform needs is configurable here;
# nothing is hardcoded in the templates. Override with -f my-values.yaml or --set.
#
# The guiding principle: we orchestrate, we don't override your choices. Bring
# your own LLM, your own MCP tool servers, and your own Postgres/Redis if you
# have them — or let the chart deploy the basics for you.
# =============================================================================

# ── Images ───────────────────────────────────────────────────────────────────
image:
  # Registry prefix for all Sentinel images. For air-gapped / private registries,
  # set this to your internal registry (e.g. registry.internal/sentinel).
  registry: sentinel
  tag: latest
  pullPolicy: IfNotPresent
# Names of imagePullSecrets that already exist in the namespace.
imagePullSecrets: []

# Common pod security posture (restricted-friendly).
podSecurityContext:
  runAsNonRoot: false        # set true once images are verified to run as non-root
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# ── Secrets ────────────────────────────────────────────────────────────────
secrets:
  # create=true: the chart renders a Secret from the values below.
  # create=false: you manage the Secret yourself — set existingSecret to its name.
  create: true
  existingSecret: ""
  # Used only when create=true. Prefer --set / a sealed secret / external-secrets.
  secretKey: "change-me-to-a-long-random-string"
  postgresPassword: "change-me-postgres-password"
  # URL-safe base64 encoding of exactly 32 random bytes. Historical versions
  # stay in credentialEncryptionKeysJson while rows are rotated.
  credentialEncryptionKey: ""
  credentialEncryptionKeysJson: ""
  # Shared bearer credential used only between the API and MCP services.
  mcpServiceToken: ""
  # Model provider keys (fill the one you use; blank is fine for keyless on-site LLMs)
  llmApiKey: ""
  anthropicApiKey: ""
  groqApiKey: ""
  googleApiKey: ""
  nvidiaApiKey: ""
  githubToken: ""
  # Optional Slack war-room (bot token enables incident mirroring; app token for replies)
  slackBotToken: ""
  slackAppToken: ""
  # Langfuse tracing is wired by default (tracing.enabled=true) — these keys are
  # required unless you set tracing.enabled=false. When langfuse.deploy=true, the
  # same pair also headlessly bootstraps the in-cluster Langfuse project (see
  # templates/langfuse.yaml), so a fresh install traces with zero manual setup.
  langfusePublicKey: "change-me-langfuse-public-key"
  langfuseSecretKey: "change-me-langfuse-secret-key"
  # Langfuse's own at-rest crypto (required by langfuse-web/-worker when
  # langfuse.deploy=true) and its NextAuth session-signing secret.
  langfuseSalt: "change-me-langfuse-salt"
  langfuseEncryptionKey: ""
  # Admin user minted by Langfuse's headless init on first boot.
  langfuseInitUserPassword: "change-me-langfuse-admin-password"

# ── Model provider ────────────────────────────────────────────────────────────
# Curated to reliable structured-output providers: anthropic | gemini.
llm:
  provider: "anthropic"
  anthropicModel: "claude-3-5-sonnet-latest"
  geminiModel: "gemini-2.0-flash"

# ── MCP tool servers ──────────────────────────────────────────────────────────
mcp:
  # Bring your own: a JSON object of client-run MCP servers, merged with the
  # built-in edge servers. Example:
  #   extraServersJson: '{"my-tool":{"url":"http://my-tool.ns:9000/sse","transport":"sse"}}'
  extraServersJson: ""
  # The built-in edge tool servers shipped with the chart. Disable any you don't
  # want, or set edge.enabled=false to run none and rely entirely on your own.
  edge:
    enabled: true
    resources:
      requests: { cpu: "25m", memory: "96Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    servers:
      - { name: mcp-k8s, image: mcp-k8s, serviceAccount: observer }
      - { name: mcp-executor, image: mcp-executor, serviceAccount: actuator,
          configEnv: [ EXECUTOR_ALLOWED_NAMESPACES, EXECUTOR_MIN_REPLICAS ] }
      - { name: mcp-prometheus, image: mcp-prometheus, configEnv: [ PROMETHEUS_URL ] }
      - { name: mcp-loki, image: mcp-loki, configEnv: [ LOKI_URL ] }
      - { name: mcp-github, image: mcp-github, secretEnv: [ GITHUB_TOKEN ] }
      - { name: mcp-github-exec, image: mcp-github-exec, secretEnv: [ GITHUB_TOKEN ] }
      - { name: mcp-runbooks, image: mcp-runbooks, env: [ { name: RUNBOOKS_DIR, value: /app/runbooks } ] }

# ── Observability defaults (per-cluster settings live in the console) ─────────
observability:
  prometheusUrl: ""
  lokiUrl: ""

# ── Slack war-room (optional) ────────────────────────────────────────────────
slack:
  warRoomChannel: "#incidents"

# ── Agent tracing (self-hosted Langfuse, wired by default) ────────────────────
tracing:
  # Every LLM/tool call is traced out of the box. Set false only to fully
  # disable tracing (also set langfuse.deploy=false to skip standing up the
  # in-cluster stack).
  enabled: true
  # "" auto-resolves: the in-cluster langfuse-web service when langfuse.deploy
  # is true, else langfuse.external.host. Set explicitly to point at your own
  # Langfuse instance (e.g. Langfuse Cloud) without deploying one in-cluster.
  langfuseHost: ""

# ── Auth / session ─────────────────────────────────────────────────────────
auth:
  accessTokenMinutes: "15"
  refreshTokenDays: "7"
  # Set true when serving over TLS (e.g. with ingress.tls) so the refresh cookie
  # carries the Secure flag.
  cookieSecure: "false"

credentialEncryption:
  keyVersion: "1"

# ── Remediation + feature flags ────────────────────────────────────────────
features:
  # Trusted policy environment: production | staging | development | testing.
  # Unknown values fail closed to production.
  clusterEnvironment: "production"
  # Reasoning + dry-run proposal always runs. This only authorizes autonomous
  # EXECUTION of gate-approved reversible actions on the live cluster. Read-only
  # by default; high severities always require human approval.
  executorLive: "false"
  # Namespaces the executor may act on (comma-separated) — the client's blast
  # radius. Empty means the executor refuses every action (safe default).
  # Set per-client via overlay / --set (see deploy/examples/).
  executorAllowedNamespaces: ""
  executorMinReplicas: "1"
  # Durability on by default (enables human-approval resume + interrupted-run
  # continuation). PostgreSQL survives API restarts and uses the same database
  # configured for the control plane.
  checkpointerEnabled: "true"
  checkpointerBackend: "postgres"
  approvalTtlMinutes: "30"
  # Redis is required for multi-replica API; memory is single-process only.
  liveBusBackend: "redis"
  debug: "false"

# ── API (control plane + agent runtime) ───────────────────────────────────────
api:
  # Use 2+ with features.liveBusBackend=redis for multi-replica safety.
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sentinel-api
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1536Mi" }

# ── Web console ───────────────────────────────────────────────────────────────
web:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sentinel-web
  # Optional browser-visible API WebSocket origin. Empty auto-selects the
  # console origin with ingress, or ws://localhost:8080 for port-forwarding.
  # Set an explicit origin only when the browser bypasses those defaults.
  wsBase: ""
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }

# ── Datastores: deploy ours, or bring your own ────────────────────────────────
postgres:
  deploy: true                 # false → use an external Postgres you already run
  image: postgres:15-alpine
  user: sentinel
  database: sentinel
  storage: 5Gi
  storageClass: ""             # "" = cluster default
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  external:                    # used when deploy=false
    host: ""
    port: "5432"
    # password comes from the Secret (secrets.* or existingSecret key POSTGRES_PASSWORD)

redis:
  deploy: true                 # false → set external.url
  image: redis:7-alpine
  # Durable AOF + PVC so restarts keep bus/cache state. Set persistence.enabled
  # false only for ephemeral disposable clusters.
  persistence:
    enabled: true
    storage: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "500m", memory: "256Mi" }
  external:
    url: ""                    # e.g. redis://redis.mycorp:6379/0

qdrant:
  deploy: true                 # false → set external.url
  image: qdrant/qdrant:latest
  storage: 2Gi
  storageClass: ""
  external:
    url: ""                    # e.g. http://qdrant.mycorp:6333

# Self-hosted Langfuse (LLM/tool tracing, wired by default — see tracing.*
# above). Reuses this chart's postgres (own logical database, "langfuse") and
# redis (own DB index, "/2") — clickhouse and minio are new, Langfuse-only
# backing services deployed alongside them.
langfuse:
  deploy: true                  # false → bring your own; set external.host + tracing.langfuseHost
  images:
    web: docker.langfuse.com/langfuse/langfuse:4
    worker: docker.langfuse.com/langfuse/langfuse-worker:4
    clickhouse: clickhouse/clickhouse-server:25.12
    minio: minio/minio:latest
  clickhouse:
    storage: 5Gi
    storageClass: ""
    # Internal-only credential between langfuse-web/-worker and this pod's
    # ClickHouse — not internet-facing and covered by networkPolicy.enabled,
    # so it lives here rather than in the required secrets.* block.
    password: "langfuse-internal"
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1", memory: "2Gi" }
  minio:
    storage: 5Gi
    storageClass: ""
    rootUser: "langfuse"
    rootPassword: "langfuse-minio-internal"
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  web:
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { cpu: "1", memory: "1536Mi" }
  worker:
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { cpu: "1", memory: "1536Mi" }
  # Headless bootstrap (LANGFUSE_INIT_*) — mints an org/project/API-keypair on
  # first boot, using secrets.langfusePublicKey/langfuseSecretKey as the
  # keypair, so tracing works immediately with zero manual UI setup.
  init:
    orgId: "sentinel"
    orgName: "Sentinel"
    projectId: "sentinel-agent"
    projectName: "Sentinel Agent"
    userEmail: "admin@sentinel.local"
    userName: "Sentinel Admin"
  external:                     # used when deploy=false
    host: ""                    # e.g. https://your-langfuse.mycorp.com

# ── RBAC for the agent's k8s tools ────────────────────────────────────────────
rbac:
  create: true
  # Default: both tool identities are restricted to one workload namespace.
  namespaced:
    enabled: true
    # Existing workload namespace that the observer/executor may access.
    # Keep aligned with features.executorAllowedNamespaces when you enable ACT.
    # Override per client with an example overlay under deploy/examples/.
    namespace: "default"
  # Explicit opt-in for observing/mutating resources across all namespaces.
  clusterWide:
    enabled: false

# ── NetworkPolicy (namespace-internal least privilege) ────────────────────────
networkPolicy:
  enabled: true

# ── Ingress (optional) ────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  host: "sentinel.your-domain"
  tls: false
  tlsSecretName: ""
  annotations: {}
