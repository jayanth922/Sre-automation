{{- if .Values.langfuse.deploy }}
# Self-hosted Langfuse (LLM/tool tracing, wired by default — see tracing.*
# in values.yaml). Reuses this chart's postgres (own logical database,
# "langfuse") and redis (own DB index, "/2"); clickhouse and minio below are
# new, Langfuse-only backing services.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.langfuse.clickhouse.storageClass }}
  storageClassName: {{ .Values.langfuse.clickhouse.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.langfuse.clickhouse.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: clickhouse }
  template:
    metadata:
      labels: { app: clickhouse }
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.langfuse.images.clickhouse | quote }}
          ports:
            - { containerPort: 8123 }
            - { containerPort: 9000 }
          env:
            - name: CLICKHOUSE_DB
              value: langfuse
            - name: CLICKHOUSE_USER
              value: langfuse
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.langfuse.clickhouse.password | quote }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources: {{- toYaml .Values.langfuse.clickhouse.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: clickhouse-data }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  selector: { app: clickhouse }
  ports:
    - { name: http, port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.langfuse.minio.storageClass }}
  storageClassName: {{ .Values.langfuse.minio.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.langfuse.minio.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: {{ .Values.langfuse.images.minio | quote }}
          args: ["server", "/data", "--console-address", ":9091"]
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9091 }
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.langfuse.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.langfuse.minio.rootPassword | quote }}
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources: {{- toYaml .Values.langfuse.minio.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: langfuse-worker }
  template:
    metadata:
      labels: { app: langfuse-worker }
    spec:
      initContainers:
        {{- include "sentinel.langfuseDbInitContainer" . | nindent 8 }}
      containers:
        - name: langfuse-worker
          image: {{ .Values.langfuse.images.worker | quote }}
          envFrom:
            - secretRef: { name: {{ include "sentinel.secretName" . }} }
          env:
            # Explicitly (re-)declared, ahead of the $(VAR) references below that
            # need them — mirrors api.yaml's DATABASE_URL pattern rather than
            # relying on envFrom-injected vars being visible to $(VAR) expansion.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: POSTGRES_PASSWORD } }
            - name: LANGFUSE_SALT
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: LANGFUSE_SALT } }
            - name: LANGFUSE_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: LANGFUSE_ENCRYPTION_KEY } }
            - name: SALT
              value: "$(LANGFUSE_SALT)"
            - name: ENCRYPTION_KEY
              value: "$(LANGFUSE_ENCRYPTION_KEY)"
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "sentinel.postgresHost" . }}:{{ include "sentinel.postgresPort" . }}/langfuse"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            - name: CLICKHOUSE_USER
              value: langfuse
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.langfuse.clickhouse.password | quote }}
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://clickhouse:9000"
            - name: REDIS_CONNECTION_STRING
              value: {{ include "sentinel.langfuseRedisUrl" . | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: langfuse
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: auto
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: {{ .Values.langfuse.minio.rootUser | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: {{ .Values.langfuse.minio.rootPassword | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
          resources: {{- toYaml .Values.langfuse.worker.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: langfuse-web }
  template:
    metadata:
      labels: { app: langfuse-web }
    spec:
      initContainers:
        {{- include "sentinel.langfuseDbInitContainer" . | nindent 8 }}
      containers:
        - name: langfuse-web
          image: {{ .Values.langfuse.images.web | quote }}
          ports:
            - { containerPort: 3000 }
          envFrom:
            - secretRef: { name: {{ include "sentinel.secretName" . }} }
          env:
            # Explicitly (re-)declared, ahead of the $(VAR) references below that
            # need them — mirrors api.yaml's DATABASE_URL pattern rather than
            # relying on envFrom-injected vars being visible to $(VAR) expansion.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: POSTGRES_PASSWORD } }
            - name: LANGFUSE_SALT
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: LANGFUSE_SALT } }
            - name: LANGFUSE_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: LANGFUSE_ENCRYPTION_KEY } }
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: LANGFUSE_PUBLIC_KEY } }
            - name: LANGFUSE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: LANGFUSE_SECRET_KEY } }
            - name: SALT
              value: "$(LANGFUSE_SALT)"
            - name: ENCRYPTION_KEY
              value: "$(LANGFUSE_ENCRYPTION_KEY)"
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "sentinel.postgresHost" . }}:{{ include "sentinel.postgresPort" . }}/langfuse"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            - name: CLICKHOUSE_USER
              value: langfuse
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.langfuse.clickhouse.password | quote }}
            - name: REDIS_CONNECTION_STRING
              value: {{ include "sentinel.langfuseRedisUrl" . | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: langfuse
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: auto
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: {{ .Values.langfuse.minio.rootUser | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: {{ .Values.langfuse.minio.rootPassword | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: NEXTAUTH_URL
              value: "http://langfuse-web:3000"
            - name: NEXTAUTH_SECRET
              value: "$(LANGFUSE_SECRET_KEY)"
            # Headless bootstrap: mints the org/project/API-keypair below on
            # first boot so secrets.langfusePublicKey/langfuseSecretKey (fed
            # to sentinel-api via the shared Secret) work with zero manual
            # UI setup.
            - name: LANGFUSE_INIT_ORG_ID
              value: {{ .Values.langfuse.init.orgId | quote }}
            - name: LANGFUSE_INIT_ORG_NAME
              value: {{ .Values.langfuse.init.orgName | quote }}
            - name: LANGFUSE_INIT_PROJECT_ID
              value: {{ .Values.langfuse.init.projectId | quote }}
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: {{ .Values.langfuse.init.projectName | quote }}
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              value: "$(LANGFUSE_PUBLIC_KEY)"
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              value: "$(LANGFUSE_SECRET_KEY)"
            - name: LANGFUSE_INIT_USER_EMAIL
              value: {{ .Values.langfuse.init.userEmail | quote }}
            - name: LANGFUSE_INIT_USER_NAME
              value: {{ .Values.langfuse.init.userName | quote }}
            # LANGFUSE_INIT_USER_PASSWORD arrives via envFrom (secrets.langfuseInitUserPassword)
          readinessProbe:
            httpGet: { path: /api/public/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.langfuse.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  selector: { app: langfuse-web }
  ports: [{ port: 3000, targetPort: 3000 }]
{{- end }}
