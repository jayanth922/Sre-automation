apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-config
  labels: {{- include "sentinel.labels" . | nindent 4 }}
data:
  # Model provider
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  ANTHROPIC_MODEL: {{ .Values.llm.anthropicModel | quote }}
  GROQ_MODEL: {{ .Values.llm.groqModel | quote }}

  # Datastores
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  REDIS_URL: {{ include "sentinel.redisUrl" . | quote }}
  QDRANT_URL: {{ include "sentinel.qdrantUrl" . | quote }}
  AGENT_MODE: "api"

  # MCP tool servers
  MCP_SERVERS_JSON: {{ .Values.mcp.extraServersJson | quote }}
  {{- if .Values.mcp.edge.enabled }}
  MCP_K8S_URI: "http://mcp-k8s:3000/sse"
  MCP_LOGS_URI: "http://mcp-loki:3000/sse"
  MCP_METRICS_URI: "http://mcp-prometheus:3000/sse"
  MCP_RUNBOOKS_URI: "http://mcp-runbooks:3000/sse"
  MCP_GITHUB_URI: "http://mcp-github:3000/sse"
  MCP_EXECUTOR_URI: "http://mcp-executor:3000/sse"
  MCP_GITHUB_EXEC_URI: "http://mcp-github-exec:3000/sse"
  {{- end }}

  # Observability fallback (per-cluster settings live in the console)
  PROMETHEUS_URL: {{ .Values.observability.prometheusUrl | quote }}
  LOKI_URL: {{ .Values.observability.lokiUrl | quote }}

  # Auth / session
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.auth.accessTokenMinutes | quote }}
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.auth.refreshTokenDays | quote }}
  COOKIE_SECURE: {{ .Values.auth.cookieSecure | quote }}
  CREDENTIAL_ENCRYPTION_KEY_VERSION: {{ .Values.credentialEncryption.keyVersion | quote }}

  # Slack war-room (bot token in the Secret enables it)
  SLACK_WAR_ROOM_CHANNEL: {{ .Values.slack.warRoomChannel | quote }}
  # Agent tracing (Langfuse keys in the Secret enable it)
  LANGFUSE_HOST: {{ .Values.tracing.langfuseHost | quote }}

  # Remediation + feature flags
  SENTINEL_CLUSTER_ENVIRONMENT: {{ .Values.features.clusterEnvironment | quote }}
  EXECUTOR_LIVE: {{ .Values.features.executorLive | quote }}
  EXECUTOR_ALLOWED_NAMESPACES: {{ .Values.features.executorAllowedNamespaces | quote }}
  EXECUTOR_MIN_REPLICAS: {{ .Values.features.executorMinReplicas | quote }}
  CHECKPOINTER_ENABLED: {{ .Values.features.checkpointerEnabled | quote }}
  CHECKPOINTER_BACKEND: {{ .Values.features.checkpointerBackend | quote }}
  APPROVAL_TTL_MINUTES: {{ .Values.features.approvalTtlMinutes | quote }}
  LIVE_BUS_BACKEND: {{ .Values.features.liveBusBackend | quote }}
  DEBUG: {{ .Values.features.debug | quote }}
  LANGCHAIN_TRACING_V2: "false"
