{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinel.observerSA" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinel.actuatorSA" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinel.sandboxSA" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}

---
# Sandbox RBAC is always namespace-scoped to a dedicated namespace, regardless
# of rbac.namespaced/rbac.clusterWide — an ephemeral Job running an
# AI-generated code fix must never be reachable outside its own sandbox
# namespace, no matter how the rest of the chart is configured.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandbox.namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sentinel.fullname" . }}-sandbox
  namespace: {{ .Values.sandbox.namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sentinel.fullname" . }}-sandbox
  namespace: {{ .Values.sandbox.namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sentinel.fullname" . }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel.sandboxSA" . }}
    namespace: {{ .Release.Namespace }}

{{ if .Values.rbac.namespaced.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sentinel.fullname" . }}-observer
  namespace: {{ .Values.rbac.namespaced.namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sentinel.fullname" . }}-actuator
  namespace: {{ .Values.rbac.namespaced.namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sentinel.fullname" . }}-observer
  namespace: {{ .Values.rbac.namespaced.namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sentinel.fullname" . }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel.observerSA" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sentinel.fullname" . }}-actuator
  namespace: {{ .Values.rbac.namespaced.namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sentinel.fullname" . }}-actuator
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel.actuatorSA" . }}
    namespace: {{ .Release.Namespace }}
{{ end }}

{{ if .Values.rbac.clusterWide.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sentinel.fullname" . }}-observer-cluster-wide
  labels: {{- include "sentinel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "nodes", "events", "namespaces", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sentinel.fullname" . }}-actuator-cluster-wide
  labels: {{- include "sentinel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "services", "nodes", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sentinel.fullname" . }}-observer-cluster-wide
  labels: {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sentinel.fullname" . }}-observer-cluster-wide
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel.observerSA" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sentinel.fullname" . }}-actuator-cluster-wide
  labels: {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sentinel.fullname" . }}-actuator-cluster-wide
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel.actuatorSA" . }}
    namespace: {{ .Release.Namespace }}
{{ end }}
{{- end }}
