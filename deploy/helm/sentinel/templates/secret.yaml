{{- if .Values.secrets.create }}
{{- $secretKey := .Values.secrets.secretKey }}
{{- $credentialKey := .Values.secrets.credentialEncryptionKey }}
{{- $mcpServiceToken := .Values.secrets.mcpServiceToken }}
{{- if or (not $secretKey) (eq $secretKey "change-me-to-a-long-random-string") }}
{{- fail "secrets.secretKey must be set to a real random value (--set secrets.secretKey=... or a values override) — leaving it unset or at the placeholder means every pod restart mints a new ephemeral key, invalidating all outstanding sessions and WebSocket tickets, and a shared placeholder across installs lets JWTs be forged" }}
{{- end }}
{{- if not $credentialKey }}
{{- fail "secrets.credentialEncryptionKey must be a URL-safe base64 encoding of 32 random bytes; it is required to encrypt cluster credentials and run migrations" }}
{{- end }}
{{- if not $mcpServiceToken }}
{{- fail "secrets.mcpServiceToken must be set to a high-entropy shared bearer token for API-to-MCP authentication" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-secrets
  labels: {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ $credentialKey | quote }}
  CREDENTIAL_ENCRYPTION_KEYS: {{ .Values.secrets.credentialEncryptionKeysJson | quote }}
  MCP_SERVICE_TOKEN: {{ $mcpServiceToken | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  NVIDIA_API_KEY: {{ .Values.secrets.nvidiaApiKey | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
  SLACK_APP_TOKEN: {{ .Values.secrets.slackAppToken | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
{{- end }}
