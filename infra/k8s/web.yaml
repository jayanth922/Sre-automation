# =============================================================================
# Sentinel web console (Next.js). Talks to the API in-cluster for data; the
# browser reaches the API's WebSocket directly via NEXT_PUBLIC_WS_BASE — set it
# to however you expose the API (port-forward default below, or your ingress).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-web
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: sentinel-web }
  template:
    metadata:
      labels: { app: sentinel-web }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: sentinel-web }
      containers:
        - name: web
          image: sentinel/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              value: "http://sentinel-api:8080"
            # Must match how the BROWSER reaches the API. Default assumes
            # `kubectl port-forward svc/sentinel-api 8080:8080`. For ingress,
            # leave empty or set the public origin (see ingress.yaml).
            - name: NEXT_PUBLIC_WS_BASE
              value: "ws://localhost:8080"
          startupProbe:
            httpGet: { path: /, port: 3000 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-web
  namespace: sentinel
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: sentinel-web }
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-web
  namespace: sentinel
spec:
  selector: { app: sentinel-web }
  ports:
    - port: 3000
      targetPort: 3000
