# ── mcp-runbooks (Notion-hosted; static creds are the single-tenant fallback,
#    SaaS clusters relay per-cluster Notion creds over MCP instead) ───────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-runbooks
  namespace: sentinel
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-runbooks } }
  template:
    metadata: { labels: { app: mcp-runbooks } }
    spec:
      containers:
        - name: mcp-runbooks
          image: sentinel/mcp-runbooks:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: HTTP_PORT, value: "3000" }
            - name: NOTION_API_KEY
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: NOTION_API_KEY, optional: true } }
            - name: NOTION_DATABASE_ID
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: NOTION_DATABASE_ID, optional: true } }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: mcp-runbooks, namespace: sentinel }
spec:
  selector: { app: mcp-runbooks }
  ports: [{ port: 3000, targetPort: 3000 }]
