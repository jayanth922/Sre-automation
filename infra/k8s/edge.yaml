# =============================================================================
# Edge MCP tool servers — the agent's hands. Each listens on :3000 (SSE at
# /sse). The k8s / executor servers talk to the cluster API via their
# ServiceAccount (in-cluster config); the rest read the cluster's Prometheus /
# Loki / GitHub as configured.
# =============================================================================

# ── mcp-k8s (read) ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-k8s
  namespace: sentinel
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-k8s } }
  template:
    metadata: { labels: { app: mcp-k8s } }
    spec:
      serviceAccountName: sentinel-observer
      containers:
        - name: mcp-k8s
          image: sentinel/mcp-k8s:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: HTTP_PORT, value: "3000" }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: mcp-k8s, namespace: sentinel }
spec:
  selector: { app: mcp-k8s }
  ports: [{ port: 3000, targetPort: 3000 }]
---
# ── mcp-executor (write: scale/restart) ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-executor
  namespace: sentinel
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-executor } }
  template:
    metadata: { labels: { app: mcp-executor } }
    spec:
      serviceAccountName: sentinel-actuator
      containers:
        - name: mcp-executor
          image: sentinel/mcp-executor:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: HTTP_PORT, value: "3000" }
            - name: EXECUTOR_ALLOWED_NAMESPACES
              valueFrom: { configMapKeyRef: { name: sentinel-config, key: EXECUTOR_ALLOWED_NAMESPACES } }
            - name: EXECUTOR_MIN_REPLICAS
              valueFrom: { configMapKeyRef: { name: sentinel-config, key: EXECUTOR_MIN_REPLICAS } }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: mcp-executor, namespace: sentinel }
spec:
  selector: { app: mcp-executor }
  ports: [{ port: 3000, targetPort: 3000 }]
---
