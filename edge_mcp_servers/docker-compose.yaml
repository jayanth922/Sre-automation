# =============================================================================
# Customer Edge Stack — Lightweight relay + MCP tool servers
#
# Connects to the client's observability stack (Prometheus, Loki) running in
# Kubernetes via localhost port mappings. Used for the local-dev topology where
# the platform + edge run in Docker; the in-cluster topology uses deploy/k8s.
#
# Usage:
#   1. Ensure the client environment is running (e.g. ../meridian-shop/start.sh)
#   2. Create .env: cp .env.example .env  (point PROMETHEUS_URL / LOKI_URL at it)
#   3. docker compose up -d --build
# =============================================================================

services:
  # ============================================
  # MCP Tool Servers (read from YOUR infra)
  # ============================================

  # ============================================
  # MCP Tool Servers (read from YOUR infra)
  # ============================================

  mcp-k8s:
    build:
      context: ./mcp_servers/k8s_real
      dockerfile: Dockerfile
    container_name: mcp-k8s
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
    environment:
      - HOST=0.0.0.0
      - KUBERNETES_API_SERVER_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:3000"
    networks:
      - edge-network
    restart: unless-stopped

  mcp-prometheus:
    build:
      context: ./mcp_servers/prometheus_real
      dockerfile: Dockerfile
    container_name: mcp-prometheus
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4001:3000"
    networks:
      - edge-network
    restart: unless-stopped

  mcp-loki:
    build:
      context: ./mcp_servers/loki_real
      dockerfile: Dockerfile
    container_name: mcp-loki
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4002:3000"
    networks:
      - edge-network
    restart: unless-stopped

  mcp-github:
    build:
      context: ./mcp_servers/github_real
      dockerfile: Dockerfile
    container_name: mcp-github
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
    ports:
      - "4003:3000"
    networks:
      - edge-network
    restart: unless-stopped

  mcp-runbooks:
    build:
      context: ./mcp_servers/runbooks_local
      dockerfile: Dockerfile
    container_name: mcp-runbooks
    environment:
      - RUNBOOKS_DIR=/app/runbooks
      - HOST=0.0.0.0
    volumes:
      - ./mcp_servers/runbooks_local/runbooks:/app/runbooks:ro
    ports:
      - "4004:3000"
    networks:
      - edge-network
    restart: unless-stopped

  # GitHub-exec — WRITE tools for code-change remediation (revert PRs). Dry-run
  # by default; guardrails restrict to revert/comment on allow-listed repos.
  mcp-github-exec:
    build:
      context: ./mcp_servers/github_exec
      dockerfile: Dockerfile
    container_name: mcp-github-exec
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
    ports:
      - "4006:3000"
    networks:
      - edge-network
    restart: unless-stopped

  # Executor — WRITE tools (restart/scale/patch/rollback). The ACT phase's hands.
  # Dry-run by default; guardrails restrict actions/namespaces (see executor_real/README.md).
  mcp-executor:
    build:
      context: ./mcp_servers/executor_real
      dockerfile: Dockerfile
    container_name: mcp-executor
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
    environment:
      - HOST=0.0.0.0
      - KUBERNETES_API_SERVER_HOST=host.docker.internal
      - EXECUTOR_ALLOWED_NAMESPACES=meridian
      - EXECUTOR_MIN_REPLICAS=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4005:3000"
    networks:
      - edge-network
    restart: unless-stopped

networks:
  edge-network:
    driver: bridge
    name: sre-edge-network
