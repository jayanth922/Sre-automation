# Agent Configuration - Maps agents to their respective tools
# Each agent specializes in a specific domain with appropriate tools

agents:
  kubernetes_agent:
    name: "Kubernetes Infrastructure Agent"
    description: "Manages Kubernetes cluster operations and monitoring"
    tools:
      - check_k8s_health
      - get_pod_status
      - list_namespaces
      - list_pods
      - list_services
      - list_deployments
      - list_events
      - get_service_endpoints
      - get_pod_logs
      - get_deployment_status
      - get_deployment_spec
      - get_node_status

  logs_agent:
    name: "Application Logs Agent"
    description: "Handles application log analysis and searching"
    tools:
      - query_logs
      - get_error_logs
      - analyze_log_patterns

  metrics_agent:
    name: "Performance Metrics Agent"
    description: "Provides application performance and resource metrics"
    tools:
      - check_prometheus_health
      - get_metric
      - get_metric_range
      - get_golden_signals

  runbooks_agent:
    name: "Operational Runbooks Agent"
    description: "Provides operational procedures and troubleshooting guides"
    tools:
      - search_runbooks
      - get_incident_playbook
      - get_troubleshooting_guide
      - get_escalation_procedures
      - get_common_resolutions

  # Read-only, like every other specialist. It used to also hold
  # create_revert_pr, comment_on_pr and revert_pr — real GitHub writes, with
  # dry_run chosen by the caller (github_exec/server.py), which means the
  # investigating model could have opened a revert PR on the live repo while
  # still diagnosing, with no human approval anywhere in the path. The
  # approved path does not come through here: the executor builds its own
  # github-exec client (executor.py `build_github_exec_tool_caller`) after the
  # policy gate and the Slack `approve fix`, so remediation is unaffected.
  # `investigation_write_guard` enforces this independently of this file.
  github_agent:
    name: "Code Change Intelligence Agent"
    description: "Correlates code changes (commits, PRs) with incidents and identifies bad commits"
    tools:
      - list_commits
      - get_commit
      - list_pull_requests
      - get_pull_request

  # Measurement only. The `single_agent` ablation arm (SENTINEL_ABLATION_ARM,
  # see sre_agent/ablation.py) runs one ReAct loop holding the union of every
  # specialist's tools, so the baseline differs from the full architecture in
  # *routing and isolation* and in nothing else. The union is written out
  # rather than computed so a tool added to one specialist does not silently
  # change the baseline's capability surface between runs — a diff here is a
  # deliberate change to what the experiment compares.
  #
  # It stays read-only for the same reason github_agent does: this agent is
  # still only investigating, and `investigation_write_guard` enforces that
  # independently of this file.
  single_agent:
    name: "Single Investigator Agent"
    description: "One ReAct loop holding every specialist's read-only tools"
    tools:
      # kubernetes_agent
      - check_k8s_health
      - get_pod_status
      - list_namespaces
      - list_pods
      - list_services
      - list_deployments
      - list_events
      - get_service_endpoints
      - get_pod_logs
      - get_deployment_status
      - get_deployment_spec
      - get_node_status
      # logs_agent
      - query_logs
      - get_error_logs
      - analyze_log_patterns
      # metrics_agent
      - check_prometheus_health
      - get_metric
      - get_metric_range
      - get_golden_signals
      # runbooks_agent
      - search_runbooks
      - get_incident_playbook
      - get_troubleshooting_guide
      - get_escalation_procedures
      - get_common_resolutions
      # github_agent
      - list_commits
      - get_commit
      - list_pull_requests
      - get_pull_request

# Global tools available to all agents
# Tools are now discovered from MCP servers (K8s, Logs, Metrics, Runbooks, GitHub, Memory)
global_tools: []

