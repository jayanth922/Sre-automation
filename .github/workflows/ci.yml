name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (deps, compile, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
      LLM_PROVIDER: groq
      LIVE_BUS_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (validates the lockfile)
        run: uv sync --frozen --extra dev
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Byte-compile (fast fail on syntax errors)
        run: uv run python -m compileall backend sre_agent
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit

  manifests:
    name: Manifests (RBAC scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Verify namespace-scoped RBAC defaults
        run: bash scripts/check_helm_rbac.sh
      - name: Verify WebSocket routing defaults
        run: bash scripts/check_helm_ws.sh

  images:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --build-arg SENTINEL_CODE_SHA=${{ github.sha }} -f platform/Dockerfile -t sentinel/api:ci .
      - name: Build web image
        run: docker build -f platform/Dockerfile.dashboard -t sentinel/web:ci dashboard
